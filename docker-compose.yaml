services:
  db:
    image: mysql:8.0
    container_name: birmenu_db
    command: --port=3307
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: birmenu
    ports:
      - "3307:3307"
      - "8000:80"
    volumes:
      - birmenu_mysql_data:/var/lib/mysql

  app:
    image: php:8.2-apache
    container_name: birmenu_app
    network_mode: "service:db"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: bash -c "docker-php-ext-install mysqli pdo pdo_mysql && apache2-foreground"

volumes:
  birmenu_mysql_data: