services:
  db:
    image: postgres:15-alpine
    container_name: birmenu_db
    environment:
      POSTGRES_USER: birmenu
      POSTGRES_PASSWORD: Ilnt94gnfi7gwZ09QstWfy1uar0lv1UZ
      POSTGRES_DB: birmenu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - birmenu_network

  app:
    build: .
    image: birmenu_app:local
    container_name: birmenu_app
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: birmenu
      DB_PASS: Ilnt94gnfi7gwZ09QstWfy1uar0lv1UZ
      DB_NAME: birmenu
      DB_PORT: 5432
    command: bash -c "apt-get update && apt-get install -y libpq-dev libzip-dev && docker-php-ext-install pdo pdo_pgsql zip && { echo 'upload_max_filesize=128M'; echo 'post_max_size=128M'; echo 'memory_limit=512M'; echo 'max_execution_time=600'; echo 'max_input_time=600'; } > /usr/local/etc/php/conf.d/birmenu-uploads.ini && apache2-foreground"
    networks:
      - birmenu_network

volumes:
  postgres_data:

networks:
  birmenu_network:


  